<!-- ACSL Prep Template · v1.0 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lx · 主题 — ACSL 备赛</title>
<style>
:root {
  --bg: #faf7f2;
  --panel: #ffffff;
  --panel-soft: #fdf9f3;
  --text: #1a1626;
  --muted: #5a536b;
  --line: #e2d9c8;
  --purple: #7c3aed;
  --amber: #d97706;
  --red: #dc2626;
  --green: #16a34a;
  --blue: #2563eb;
  --teal: #0f9f9a;
  --ink: #2d1b4e;
  --shadow: 0 18px 46px rgba(124, 58, 237, .10);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "HarmonyOS Sans", "Source Han Sans SC", "Alibaba PuHuiTi", "PingFang SC", Inter, Arial, sans-serif;
  color: var(--text);
  background:
    linear-gradient(135deg, rgba(124, 58, 237, .08), transparent 36%),
    linear-gradient(225deg, rgba(217, 119, 6, .08), transparent 34%),
    var(--bg);
  font-size: 18px; line-height: 1.7;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(124, 58, 237, .05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124, 58, 237, .05) 1px, transparent 1px);
  background-size: 38px 38px;
  mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .52), transparent 78%);
  pointer-events: none;
}
a { color: inherit; }
.deck-page { height: 100%; overflow: hidden; }
.deck { position: relative; z-index: 1; width: 100vw; height: 100vh; }
.slide {
  position: absolute; inset: 0;
  display: none;
  padding: 56px 80px 100px;
  opacity: 0;
  transform: translateX(24px);
  transition: .35s ease;
  overflow-y: auto;
}
.slide.active {
  display: grid;
  grid-template-columns: .95fr 1.05fr;
  gap: 42px;
  opacity: 1; transform: translateX(0);
}
.slide.wide.active { grid-template-columns: 1fr; }
.slide.title-slide.active,
.slide.part-slide.active { grid-template-columns: 1fr; place-items: center; align-content: center; text-align: center; }
.slide.title-slide .left, .slide.part-slide .left { align-items: center; width: min(1080px, 100%); justify-content: center; }
.slide.title-slide .right { display: none; }
.slide.part-slide .right { width: min(1080px, 100%); justify-content: center; }
.left, .right { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.kicker {
  display: inline-flex; align-items: center; width: max-content;
  padding: 10px 14px; border-radius: 999px;
  background: rgba(124, 58, 237, .08);
  border: 1px solid rgba(124, 58, 237, .22);
  color: #6d28d9;
  font-size: 16px; font-weight: 800;
  margin-bottom: 22px;
}
.kicker.amber {
  background: rgba(217, 119, 6, .1);
  border-color: rgba(217, 119, 6, .24);
  color: #b45309;
}
h1 { font-size: clamp(42px, 5vw, 66px); line-height: 1.1; margin: 0 0 22px; color: var(--ink); }
h2 { font-size: clamp(34px, 4vw, 50px); line-height: 1.16; margin: 0 0 20px; color: var(--ink); }
h3 { margin: 0 0 12px; font-size: 26px; line-height: 1.3; color: var(--ink); }
.subtitle { max-width: 820px; color: var(--muted); font-size: 22px; line-height: 1.75; margin: 0 0 24px; }
.highlight { color: var(--purple); font-weight: 900; }
.muted { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  display: inline-flex; align-items: center; min-height: 38px;
  padding: 9px 14px; border-radius: 999px;
  background: var(--panel-soft); border: 1px solid var(--line);
  color: #25415f; font-weight: 800; font-size: 16px;
}
.chip.purple { background: rgba(124, 58, 237, .1); color: #6d28d9; border-color: rgba(124, 58, 237, .24); }
.chip.amber  { background: rgba(217, 119, 6, .1); color: #b45309; border-color: rgba(217, 119, 6, .24); }
.chip.red    { background: rgba(220, 38, 38, .08); color: #b91c1c; border-color: rgba(220, 38, 38, .2); }
.chip.green  { background: rgba(22, 163, 74, .1); color: #047857; border-color: rgba(22, 163, 74, .22); }
.chip.blue   { background: rgba(37, 99, 235, .08); color: #1d4ed8; border-color: rgba(37, 99, 235, .18); }
.chip.teal   { background: rgba(15, 159, 154, .1); color: #0f766e; border-color: rgba(15, 159, 154, .24); }

.card, .metaphor, .step-block, .takeaway, .practice, .bug {
  background: rgba(255, 255, 255, .88);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
}
.card { padding: 22px 24px; }
.metaphor {
  padding: 22px 24px;
  border-left: 6px solid var(--amber);
  font-size: 20px;
  line-height: 1.7;
}
.metaphor .emo { font-size: 30px; margin-right: 12px; vertical-align: middle; }
.metaphor b { color: var(--amber); }
.practice {
  background: linear-gradient(135deg, rgba(22, 163, 74, .04), rgba(15, 159, 154, .04));
  border: 1px solid rgba(22, 163, 74, .22);
  padding: 22px 24px;
}
.practice .label, .bug .label, .takeaway .label, .metaphor .label {
  display: inline-flex; align-items: center;
  padding: 6px 12px; border-radius: 999px;
  background: rgba(22, 163, 74, .12);
  color: #047857;
  font-size: 14px; font-weight: 800;
  margin-bottom: 14px;
}
.bug .label { background: rgba(220, 38, 38, .1); color: #b91c1c; }
.takeaway { background: var(--ink); color: #edf6ff; padding: 22px 26px; border: 1px solid var(--ink); }
.takeaway .label { background: rgba(255, 255, 255, .14); color: #edf6ff; }
.takeaway h3 { color: #edf6ff; }
.takeaway p { color: #cbd9ed; margin: 6px 0; font-size: 19px; }
.bug {
  background: linear-gradient(135deg, rgba(220, 38, 38, .04), rgba(217, 119, 6, .04));
  border: 1px solid rgba(220, 38, 38, .22);
  padding: 22px 24px;
}
.practice ol, .practice ul, .bug ol, .bug ul { padding-left: 26px; margin: 8px 0; }
.practice li, .bug li { margin-bottom: 10px; font-size: 19px; line-height: 1.65; }
.practice li::marker { color: var(--green); font-weight: 800; }
.bug li::marker { color: var(--red); font-weight: 800; }

pre {
  background: #0f243f;
  color: #edf6ff;
  font-size: 19px;
  line-height: 1.75;
  border-radius: 10px;
  padding: 22px 26px;
  margin: 12px 0;
  overflow-x: auto;
  font-family: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
  white-space: pre;
}
pre code .kw { color: #ff9d72; font-weight: 700; }
pre code .str { color: #a5e88c; }
pre code .num { color: #ffb547; }
pre code .com { color: #7c8aa8; font-style: italic; }
pre code .fn { color: #82d4ff; font-weight: 700; }
code.inline {
  background: rgba(15, 36, 63, .08);
  border: 1px solid rgba(15, 36, 63, .12);
  padding: 2px 8px; border-radius: 6px;
  font-family: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
  font-size: 0.92em; color: #6d28d9;
  font-weight: 700;
  white-space: nowrap;
}

table { width: 100%; border-collapse: collapse; font-size: 19px; line-height: 1.55; margin: 14px 0; }
th { text-align: left; font-size: 14px; color: #25415f; font-weight: 800;
     padding: 12px 14px; border-bottom: 2px solid var(--line); background: var(--panel-soft); }
td { padding: 16px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td code, th code { font-size: 17px; }

.flow {
  display: grid; grid-template-columns: 1fr auto 1fr auto 1fr;
  gap: 12px; align-items: stretch; margin: 16px 0;
}
.flow .step {
  padding: 18px 16px;
  background: rgba(255, 255, 255, .88);
  border: 1px solid var(--line);
  border-radius: 10px;
  text-align: center;
  box-shadow: var(--shadow);
}
.flow .step .num { font-size: 14px; color: var(--purple); font-weight: 800; }
.flow .step .ttl { font-size: 22px; font-weight: 900; margin-top: 6px; color: var(--ink); }
.flow .step .desc { font-size: 15px; color: var(--muted); margin-top: 6px; }
.flow .arrow { display: grid; place-items: center; color: var(--purple); font-size: 28px; font-weight: 900; }

.warning { border-left: 5px solid var(--amber); padding-left: 18px; }
.success  { border-left: 5px solid var(--green); padding-left: 18px; }
.danger   { border-left: 5px solid var(--red);   padding-left: 18px; }
.info     { border-left: 5px solid var(--purple); padding-left: 18px; }

.big-list { display: grid; gap: 12px; }
.list-item {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 20px; border-radius: 10px;
  background: rgba(255, 255, 255, .88);
  border: 1px solid var(--line);
  font-size: 22px; font-weight: 800;
  box-shadow: var(--shadow);
}
.num {
  display: grid; place-items: center;
  min-width: 44px; height: 44px;
  border-radius: 10px;
  background: #f0e7ff; color: #6d28d9;
  font-weight: 900; font-size: 18px;
}
pre .num, code .num { display: inline; min-width: 0; height: auto; background: none; border-radius: 0;
  padding: 0; margin: 0; font-size: inherit; font-weight: inherit; font-family: inherit; }

.nav {
  position: fixed; z-index: 10;
  left: 80px; right: 80px; bottom: 28px;
  display: flex; align-items: center; gap: 16px;
}
.nav a { text-decoration: none; }
.nav button:disabled { opacity: .38; cursor: not-allowed; }
.counter { font-weight: 900; color: #314860; min-width: 84px; text-align: center; font-size: 18px; }
.progress-bar { flex: 1; height: 10px; border-radius: 999px; background: rgba(124, 58, 237, .12); overflow: hidden; }
.progress-bar span {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--purple), var(--amber));
  transition: .25s ease;
}
.nav button {
  display: inline-flex; justify-content: center; align-items: center;
  min-height: 48px; border: 0; border-radius: 10px;
  padding: 12px 22px;
  background: var(--ink); color: #fff;
  font-weight: 900; cursor: pointer;
  box-shadow: 0 12px 28px rgba(45, 27, 78, .18);
  font-size: 16px;
  text-decoration: none;
}
.nav button.secondary, .nav .home-link.secondary { background: #f4eee0; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.nav .home-link.secondary { padding: 12px 22px; }

@media (max-width: 1080px) {
  .slide.active { grid-template-columns: 1fr; gap: 28px; }
  .slide { padding: 48px 36px 110px; }
  h1 { font-size: 40px; } h2 { font-size: 32px; }
}
.slide.compact { padding: 32px 56px 96px; }
.slide.compact.active {
  display: flex !important;
  flex-direction: column;
  gap: 0;
}
.slide.compact .head { flex: 0 0 auto; }
.slide.compact .grid2x2, .slide.compact .grid { flex: 1; min-height: 0; }
.slide.compact h2 { font-size: clamp(28px, 3.4vw, 40px); margin-bottom: 14px; }
.slide.compact .subtitle { font-size: 19px; line-height: 1.6; margin-bottom: 14px; }
.slide.compact .kicker { margin-bottom: 14px; padding: 8px 12px; font-size: 14px; }
.slide.compact pre { white-space: pre; }
.slide.compact .practice { padding: 16px 20px; }
.slide.compact .practice .label { padding: 5px 10px; font-size: 13px; margin-bottom: 8px; }

/* 检验问题卡 */
.check-q {
  padding: 14px 18px;
  margin: 12px 0;
  background: rgba(245, 158, 11, .08);
  border-left: 4px solid var(--amber);
  border-radius: 8px;
}
.check-q-blue {
  background: rgba(124, 58, 237, .08);
  border-left-color: var(--purple);
}
.check-q-text {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.6;
}
.check-q details summary {
  cursor: pointer;
  color: var(--purple);
  margin-top: 8px;
  font-size: 15px;
  font-weight: 600;
  list-style: none;
}
.check-q details summary::-webkit-details-marker { display: none; }
.check-q details summary::before { content: '▸ '; color: var(--purple); }
.check-q details[open] summary::before { content: '▾ '; }
.check-q details summary:hover { text-decoration: underline; }
.check-q details[open] summary { margin-bottom: 8px; }
.check-a {
  padding: 10px 14px;
  background: rgba(22, 163, 74, .08);
  border-radius: 6px;
  font-family: "JetBrains Mono", "Fira Code", monospace;
  font-size: 16px;
  color: #047857;
  margin-top: 4px;
  line-height: 1.5;
  white-space: pre-wrap;
}

/* Recap 网格卡片 */
.recap-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  margin-top: 8px;
}
.recap-card {
  padding: 18px 16px;
  background: var(--panel);
  border-radius: 12px;
  border: 2px solid var(--line);
  position: relative;
  min-height: 110px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.recap-card.card-purple { border-color: var(--purple); background: rgba(124, 58, 237, .04); }
.recap-card.card-amber  { border-color: var(--amber);  background: rgba(217, 119, 6, .04); }
.recap-card.card-green  { border-color: var(--green);  background: rgba(22, 163, 74, .04); }
.recap-card.card-blue   { border-color: var(--blue);   background: rgba(37, 99, 235, .04); }
.recap-card.card-red    { border-color: var(--red);    background: rgba(220, 38, 38, .04); }
.recap-card.card-teal   { border-color: var(--teal);   background: rgba(15, 159, 154, .04); }

.recap-num {
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 10px;
  color: var(--text);
}
.recap-card.card-purple .recap-num { color: var(--purple); }
.recap-card.card-amber  .recap-num { color: var(--amber); }
.recap-card.card-green  .recap-num { color: var(--green); }
.recap-card.card-blue   .recap-num { color: var(--blue); }
.recap-card.card-red    .recap-num { color: var(--red); }
.recap-card.card-teal   .recap-num { color: var(--teal); }

.recap-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.recap-sub {
  font-size: 13px;
  color: var(--muted);
}
.recap-next {
  font-size: 14px;
  color: var(--muted);
  margin-top: 16px;
  text-align: left;
}

/* 网格 */
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.grid3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
}

/* ASCII 二进制可视化 */
.bin-vis {
  display: inline-block;
  font-family: "JetBrains Mono", monospace;
  font-size: 22px;
  letter-spacing: 4px;
}
.bin-vis .bit { padding: 4px 8px; border-radius: 4px; margin: 0 2px; }
.bin-vis .bit.on  { background: #6d28d9; color: #fff; }
.bin-vis .bit.off { background: rgba(124, 58, 237, .15); color: #6d28d9; }
.bin-vis .bit-group { margin: 0 8px; }

/* 卡片链接样式 */
.link-card {
  display: block;
  text-decoration: none;
  color: inherit;
  padding: 18px 22px;
  background: rgba(255, 255, 255, .88);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.link-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 24px 60px rgba(124, 58, 237, .18);
}
</style>
</head>
<body class="deck-page">
<main class="deck" id="deck">

  <!-- ============================================================ -->
  <!--  📌 TEMPLATE 占位（_new_lesson.py 会自动替换此区）            -->
  <!--  后续所有 Lx.html 都基于此模板                                -->
  <!--  参考 L1 现有格式，确保一致                                   -->
  <!-- ============================================================ -->

  <!-- ==== Cover 页（首页）==== -->
  <section class="slide title-slide active">
    <div class="left">
      <div class="kicker">📌 Template · Lx Cover</div>
      <h1>ACSL 备赛 · <span class="highlight">XXX</span></h1>
      <p class="subtitle">主题名 · N 个核心概念</p>
      <p style="margin-top:24px; padding:16px; background:rgba(245,158,11,.08); border-left:4px solid var(--amber); border-radius:8px; font-size:15px; line-height:1.7;">
        <b>模板用法</b>：<br>
        1. 准备 body 文件（<code class="inline">&lt;section&gt;...&lt;/section&gt;...</code>）<br>
        2. 运行：<code class="inline">python _new_lesson.py N "标题" /tmp/lN_body.html TOTAL</code><br>
        3. 自动生成 LN.html（含 title、main、body 全部）
      </p>
    </div>
  </section>

</main>


<div class="nav">
  <a class="home-link secondary" href="index.html">📚 目录</a>
  <button class="secondary" onclick="prev()">← 上页</button>
  <span class="counter"><span id="cur">1</span> / <span id="total">12</span></span>
  <div class="progress-bar"><span id="bar"></span></div>
  <button onclick="next()">下页 →</button>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  document.getElementById('total').textContent = total;
  let idx = 0;
  function show(i) {
    if (i < 0) i = 0;
    if (i >= total) i = total - 1;
    slides.forEach(s => s.classList.remove('active'));
    slides[i].classList.add('active');
    document.getElementById('cur').textContent = i + 1;
    document.getElementById('bar').style.width = ((i + 1) / total * 100) + '%';
    idx = i;
    slides[i].scrollTop = 0;
  }
  function next() { show(idx + 1); }
  function prev() { show(idx - 1); }
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  });
  let tx = 0;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) { if (dx < 0) next(); else prev(); }
  });
</script>
</body>
</html>
