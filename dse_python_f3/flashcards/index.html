// ============ 渲染逻辑 ============
const grid = document.getElementById('card-grid');
const tabs = document.querySelectorAll('.tab');
const courseInfos = document.querySelectorAll('.course-info');
const lessonChips = document.querySelectorAll('.lesson-chip');
const statsBar = document.getElementById('stats-bar');
const flipCount = document.getElementById('flip-count');

let currentCourse = 'python';
let currentLesson = 'all';
let flippedCount = 0;

function escapeHTML(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightCode(code) {
  // 简单的代码高亮
  return escapeHTML(code)
    .replace(/(#[^\n]*)/g, '<span style="color:#7c8aa8;font-style:italic;">$1</span>')
    .replace(/(\"[^\"]*\")/g, '<span style="color:#a5e88c;">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span style="color:#ffb547;">$1</span>')
    .replace(/\b(if|else|elif|for|while|break|continue|True|False|in|not|and|or|def|return|print|input|int|float|str|bool|range|len|max|min|sum)\b/g, '<span style="color:#ff9d72;font-weight:700;">$1</span>');
}

function renderCards() {
  let cards = FLASHCARDS.filter(c => c.lesson.startsWith(currentLesson === 'all' ? '' : currentLesson));
  if (currentLesson === 'all') cards = FLASHCARDS;

  if (cards.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--muted);">暂无卡片</div>';
    return;
  }

  grid.innerHTML = cards.map(c => `
    <div class="flashcard" data-id="${c.id}" onclick="flipCard(this)">
      <div class="flashcard-inner">
        <!-- 正面 -->
        <div class="flashcard-face flashcard-front">
          <span class="flashcard-tag">${c.id} · ${c.type === 'killer' ? '杀手锏' : c.type === 'bug' ? 'Bug' : '概念'}</span>
          <div class="flashcard-term">${escapeHTML(c.term)}</div>
          <div class="flashcard-question">${escapeHTML(c.question)}</div>
          <div class="flashcard-fill">${escapeHTML(c.fill)}</div>
          <div class="flashcard-hint">点击翻面 →</div>
        </div>
        <!-- 反面 -->
        <div class="flashcard-face flashcard-back">
          <span class="flashcard-tag">答案 · ${c.id}</span>
          <div class="flashcard-question">${escapeHTML(c.title)}</div>
          <div class="answer"><strong>答：</strong>${escapeHTML(c.answer)}</div>
          <div class="mnemonic">💡 ${escapeHTML(c.mnemonic)}</div>
          <pre>${highlightCode(c.code)}</pre>
          ${c.warnings.length > 0 ? `<div class="warning">${c.warnings.map(w => `<span class="star">${escapeHTML(w)}</span>`).join('<br>')}</div>` : ''}
          <div class="flashcard-hint">← 点击翻回</div>
        </div>
      </div>
    </div>
  `).join('');
}

function flipCard(el) {
  el.classList.toggle('flipped');
  const id = el.dataset.id;
  if (el.classList.contains('flipped')) {
    flippedCount++;
    statsBar.classList.add('active');
    flipCount.textContent = flippedCount;
  }
}

// Tab 切换
tabs.forEach(t => {
  t.addEventListener('click', () => {
    if (t.classList.contains('locked')) return;
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentCourse = t.dataset.course;
    courseInfos.forEach(ci => ci.classList.toggle('active', ci.dataset.course === currentCourse));
    // 切换到非 python 课程时显示提示
    if (currentCourse !== 'python') {
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--muted);">该课程卡片备课中...</div>';
    } else {
      renderCards();
    }
  });
});

// Lesson 筛选
lessonChips.forEach(chip => {
  chip.addEventListener('click', () => {
    lessonChips.forEach(x => x.classList.remove('active'));
    chip.classList.add('active');
    currentLesson = chip.dataset.lesson;
    renderCards();
  });
});

// 初始化
renderCards();
</script>
