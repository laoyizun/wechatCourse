<script>
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  document.getElementById('total').textContent = total;
  let idx = 0;
  function show(i) {
    if (i < 0) i = 0;
    if (i >= total) i = total - 1;
    slides.forEach(s => s.classList.remove('active'));
    slides[i].classList.add('active');
    document.getElementById('cur').textContent = i + 1;
    document.getElementById('bar').style.width = ((i + 1) / total * 100) + '%';
    idx = i;
    slides[i].scrollTop = 0;
  }
  function next() { show(idx + 1); }
  function prev() { show(idx - 1); }
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  });
  let tx = 0;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) { if (dx < 0) next(); else prev(); }
  });

  // === 代码块 · 右上角 Run + Copy 按钮 + 整块点击复制 ===
    (function bindCodeBlocks() {
    const pres = document.querySelectorAll('pre');
    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed'; ta.style.top = '-9999px';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (_) {}
          document.body.removeChild(ta);
        });
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      return Promise.resolve();
    }

    pres.forEach(pre => {
      const actions = pre.querySelector('.code-actions');
      if (!actions) return;
      const btn = actions.querySelector('.copy-btn');
      if (!btn) return;
      const doCopy = (e) => {
        if (e) { e.stopPropagation(); e.preventDefault(); }
        const code = pre.querySelector('code');
        const text = code ? code.innerText : pre.innerText;
        copyText(text).then(() => {
          btn.innerHTML = '✓ Copied';
          btn.classList.add('copied');
          setTimeout(() => { btn.innerHTML = '📋 Copy'; btn.classList.remove('copied'); }, 1500);
        });
      };
      btn.addEventListener('mousedown', doCopy);
      btn.addEventListener('click', doCopy);
    });
  })();
</script>
