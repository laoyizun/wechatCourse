<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小程序项目实践 - 从入门到精通</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366F1;
            --intro: #10B981;
            --tool: #F59E0B;
            --social: #EC4899;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --text-secondary: #64748B;
        }
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .page-wrap {
            min-height: 100vh;
            padding: 48px 24px 64px;
            position: relative;
            overflow: hidden;
        }
        .page-wrap::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 15s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
        .content {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
        }
        .header { text-align: center; margin-bottom: 48px; }
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.2);
            margin-bottom: 14px;
        }
        .header p {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.92);
            max-width: 620px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .entry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }
        .entry-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 36px 32px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 3px solid transparent;
            display: block;
        }
        .entry-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: var(--accent);
        }
        .entry-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .entry-card.projects { --accent: linear-gradient(135deg, var(--intro), var(--tool), var(--social)); }
        .entry-card.scenarios { --accent: linear-gradient(135deg, var(--primary), #EC4899); }
        .entry-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .entry-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
        }
        .entry-card .entry-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .entry-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .entry-tag {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .entry-tag.intro { background: rgba(16,185,129,0.12); color: #047857; }
        .entry-tag.tool { background: rgba(245,158,11,0.12); color: #B45309; }
        .entry-tag.social { background: rgba(236,72,153,0.12); color: #BE185D; }
        .entry-tag.primary { background: rgba(99,102,241,0.12); color: #4338CA; }
        .entry-cta {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.95rem;
        }
        .entry-cta::after {
            content: '→';
            transition: transform 0.2s;
        }
        .entry-card:hover .entry-cta::after { transform: translateX(4px); }
        .footer {
            text-align: center;
            margin-top: 56px;
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
        }
        @media (max-width: 640px) {
            .header h1 { font-size: 2rem; }
            .entry-card { padding: 28px 24px; }
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="content">
            <div class="header">
                <h1>小程序项目实践</h1>
                <p>跟着小方一起,从简单到复杂,做出 17 个有趣的小程序。把"我想做什么"翻译成 AI 能听懂的产品需求。</p>
            </div>
            <div class="entry-grid">
                <a class="entry-card projects" href="projects.html">
                    <div class="entry-icon">📱</div>
                    <h2>小程序分类</h2>
                    <p class="entry-desc">17 个项目,3 大类。在每一类里查看项目列表、勾选目标、跟着 AI 一边做一边学。</p>
                    <div class="entry-tags">
                        <span class="entry-tag intro">介绍类 · 5 个</span>
                        <span class="entry-tag tool">效率工具 · 6 个</span>
                        <span class="entry-tag social">社交创意 · 6 个</span>
                    </div>
                    <span class="entry-cta">开始做项目</span>
                </a>
                <a class="entry-card scenarios" href="scenarios.html">
                    <div class="entry-icon">📖</div>
                    <h2>场景分析</h2>
                    <p class="entry-desc">先看看小方遇到了什么问题,想清楚"为什么要做"再开始。六个故事,六种思考方式。</p>
                    <div class="entry-tags">
                        <span class="entry-tag primary">小方开学第一天</span>
                        <span class="entry-tag primary">小方要送妈妈礼物</span>
                        <span class="entry-tag primary">小方请同学来玩</span>
                        <span class="entry-tag primary">小方的周三</span>
                        <span class="entry-tag primary">小方的班级冰箱</span>
                        <span class="entry-tag primary">小方的翻牌游戏</span>
                    </div>
                    <span class="entry-cta">看故事</span>
                </a>
            </div>
            <div class="footer">© 2026 小程序项目实践课程</div>
        </div>
    </div>
</body>
</html>
